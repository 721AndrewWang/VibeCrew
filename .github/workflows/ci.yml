name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, unit and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The real Claude Code CLI, for the tests that drive it against a local mock model endpoint
      # (no account or API key involved). Without it those tests are skipped.
      - run: npm install -g @anthropic-ai/claude-code
      - run: git config --global user.name ci && git config --global user.email ci@example.com
      - run: npm run typecheck
      - run: npx biome ci .
      - run: npm test

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: git config --global user.name ci && git config --global user.email ci@example.com
      # Google Chrome comes with the runner image; the tests use it rather than downloading a browser.
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
