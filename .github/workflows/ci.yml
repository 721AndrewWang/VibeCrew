name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 20 * * *' # 04:00 Beijing time

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, unit and integration tests
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The real Claude Code CLI, for the tests that drive it against a local mock model endpoint
      # (no account or API key involved). Without it those tests are skipped.
      - run: npm install -g @anthropic-ai/claude-code
      # The command sandbox's dependencies, for the tests that run commands inside it.
      - run: sudo apt-get install -y bubblewrap socat
      - run: git config --global user.name ci && git config --global user.email ci@example.com
      - run: npm run typecheck
      - run: npx biome ci .
      - run: npm test

  e2e:
    name: Browser tests
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: git config --global user.name ci && git config --global user.email ci@example.com
      # Google Chrome comes with the runner image; the tests use it rather than downloading a browser.
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  # Crew leans on Claude Code's command line: permission modes, hooks, context usage, the
  # replaced bundled binary. Claude Code ships often, so every night the CLI tests run against
  # its newest release (and on demand), to find a break before a user does.
  latest-claude-code:
    name: Against the newest Claude Code
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm install -g @anthropic-ai/claude-code@latest && claude --version
      - run: sudo apt-get install -y bubblewrap socat
      - run: git config --global user.name ci && git config --global user.email ci@example.com
      - run: npx vitest run tests/integration/claude-cli.test.ts tests/integration/sandbox.test.ts
